name: nursemate

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nursemate
      POSTGRES_USER: nursemate
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nursemate -d nursemate"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nursemate]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nursemate]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://nursemate:${DB_PASSWORD}@postgres:5432/nursemate
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      WECHAT_SUBSCRIBE_TEMPLATE_ID: ${WECHAT_SUBSCRIBE_TEMPLATE_ID:-}
      REMINDER_PRE_MINUTES: ${REMINDER_PRE_MINUTES:-120}
      REMINDER_OVERDUE_DELAY_MINUTES: ${REMINDER_OVERDUE_DELAY_MINUTES:-1}
      SEED_HEAD_EMPLOYEE_NO: ${SEED_HEAD_EMPLOYEE_NO:-admin}
      SEED_HEAD_PASSWORD: ${SEED_HEAD_PASSWORD}
      SEED_NURSE_PASSWORD: ${SEED_NURSE_PASSWORD}
      FILE_STORAGE_PATH: /data/nursemate
    volumes:
      - file-data:/data/nursemate
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [nursemate]

  gateway:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.gateway
    restart: unless-stopped
    ports:
      - "8101:80"
    depends_on:
      api:
        condition: service_healthy
    networks: [nursemate]

volumes:
  postgres-data:
  redis-data:
  file-data:

networks:
  nursemate:
    driver: bridge
