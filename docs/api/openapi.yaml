openapi: 3.1.0
info:
  title: 护知音 HZY API
  version: 0.1.0
  description: |
    V1.0 初始接口契约。账号密码用于小程序与 H5；微信身份关联只提供微信平台能力。
    业务写入时间由服务端生成，确认、完成、提交、审核和提醒是独立状态与记录。
servers:
  - url: https://test.example.invalid/api/v1
    description: 云端测试环境占位地址
tags:
  - name: Auth
    description: 账号激活、登录、会话与微信身份关联
  - name: Me
    description: 当前登录用户与本人业务数据
  - name: Users
    description: 科室人员、分组和协管员权限管理
  - name: Notices
    description: 通知草稿、发布、查看、确认与统计
  - name: Tasks
    description: 任务发布、提交、审核与执行明细
  - name: Reminders
    description: 通知和任务催办记录
  - name: Reports
    description: 管理看板与异步导出
  - name: Files
    description: 受控附件上传与核验
  - name: Audit
    description: 本科室只读审计日志
  - name: Health
    description: 服务存活和依赖就绪检查

paths:
  /auth/activate:
    post:
      tags: [Auth]
      summary: 使用一次性激活码激活预建账号并设置密码
      operationId: activateAccount
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: 使用一次性重置码设置新密码
      operationId: resetPassword
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: 密码已重置，旧会话全部撤销
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'

  /auth/login:
    post:
      tags: [Auth]
      summary: 工号和密码登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: 轮换刷新令牌
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  minLength: 20
      responses:
        '200':
          $ref: '#/components/responses/AuthSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: 注销当前设备会话
      operationId: logout
      responses:
        '204':
          description: 会话已注销
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/wechat/associate:
    post:
      tags: [Auth]
      summary: 将当前内部账号关联到小程序微信身份
      operationId: associateWechatIdentity
      description: 关联失败不得注销当前账号密码会话。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: 关联成功或已关联
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WechatAssociationResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '502':
          $ref: '#/components/responses/DependencyError'

  /me:
    get:
      tags: [Me]
      summary: 获取当前用户、角色和有效权限
      operationId: getMe
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'

  /me/notices:
    get:
      tags: [Notices]
      summary: 查询本人接收的通知
      operationId: listMyNotices
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [UNSEEN, VIEWED, CONFIRMED, OVERDUE_UNSEEN, OVERDUE_UNCONFIRMED, RECONFIRM_REQUIRED]
      responses:
        '200':
          description: 本人通知分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/NoticeSummary'

  /me/notices/{noticeId}:
    get:
      tags: [Notices]
      summary: 查看本人收到的通知详情并记录首次查看
      operationId: getMyNotice
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      responses:
        '200':
          description: 通知详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/notices/{noticeId}/confirm:
    post:
      tags: [Notices]
      summary: 确认已阅读并知晓指定通知版本
      operationId: confirmMyNotice
      parameters:
        - $ref: '#/components/parameters/NoticeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionNo]
              properties:
                versionNo:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 确认结果；重复相同请求返回首次结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /me/tasks:
    get:
      tags: [Tasks]
      summary: 查询本人负责的任务
      operationId: listMyTasks
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskRecordStatus'
      responses:
        '200':
          description: 本人任务分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TaskSummary'

  /me/tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: 获取本人任务详情和提交历史
      operationId: getMyTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/tasks/{taskId}/complete:
    post:
      tags: [Tasks]
      summary: 完成简单模式任务
      operationId: completeMySimpleTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 完成结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRecordResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /me/tasks/{taskId}/submissions:
    post:
      tags: [Tasks]
      summary: 提交或重提审核模式任务反馈
      operationId: submitMyReviewTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskSubmissionRequest'
      responses:
        '201':
          description: 已生成不可覆盖的提交版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSubmissionResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /users:
    get:
      tags: [Users]
      summary: 查询科室人员
      operationId: listUsers
      x-permission: user.manage or management recipient selector
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
      responses:
        '200':
          description: 权限范围内的人员列表
    post:
      tags: [Users]
      summary: 预建人员账号
      operationId: createUser
      x-permission: user.manage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 已创建待激活账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/import:
    post:
      tags: [Users]
      summary: 批量导入预建人员账号
      operationId: importUsers
      x-permission: user.manage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: 逐行成功、失败和失败原因；重复工号不创建

  /groups:
    get:
      tags: [Users]
      summary: 查询护理分组
      operationId: listGroups
      x-permission: user.manage or management recipient selector
      responses:
        '200':
          description: 权限范围内的有效分组
    post:
      tags: [Users]
      summary: 新建护理分组
      operationId: createGroup
      x-permission: user.manage
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
      responses:
        '201':
          description: 已创建分组

  /groups/{groupId}:
    patch:
      tags: [Users]
      summary: 修改分组名称或启用状态
      operationId: updateGroup
      x-permission: user.manage
      parameters:
        - $ref: '#/components/parameters/GroupId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
      responses:
        '200':
          description: 更新后的分组

  /users/{userId}:
    patch:
      tags: [Users]
      summary: 修改人员、角色、分组或状态
      operationId: updateUser
      x-permission: user.manage
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 更新后的人员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /users/{userId}/activation-codes:
    post:
      tags: [Users]
      summary: 生成一次性激活或密码重置码
      operationId: createActivationCode
      x-permission: user.manage
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, reason]
              properties:
                purpose:
                  type: string
                  enum: [ACTIVATE_ACCOUNT, RESET_PASSWORD]
                reason:
                  type: string
                  minLength: 1
                  maxLength: 255
      responses:
        '201':
          description: 明文激活码仅在本次响应展示
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationCodeResponse'

  /users/{userId}/permissions:
    put:
      tags: [Users]
      summary: 替换协管员细粒度权限
      operationId: replaceUserPermissions
      x-permission: permission.manage
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/PermissionCode'
      responses:
        '200':
          description: 当前有效权限

  /users/{userId}/wechat-association:
    delete:
      tags: [Users]
      summary: 管理员解除用户当前微信身份关联
      operationId: unbindUserWechatIdentity
      x-permission: user.manage
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/RequiredReason'
      responses:
        '204':
          description: 已解除关联并记录审计；账号密码仍然有效

  /users/{userId}/sessions:
    delete:
      tags: [Users]
      summary: 撤销用户全部设备会话
      operationId: revokeUserSessions
      x-permission: user.manage
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/RequiredReason'
      responses:
        '204':
          description: 所有刷新会话已撤销

  /notices:
    get:
      tags: [Notices]
      summary: 查询可管理的通知
      operationId: listManagedNotices
      x-permission: notice.publish or notice.stats or notice.manage
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/NoticeStatus'
      responses:
        '200':
          description: 通知分页列表
    post:
      tags: [Notices]
      summary: 创建通知草稿
      operationId: createNotice
      x-permission: notice.publish
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeDraftRequest'
      responses:
        '201':
          description: 通知草稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedNoticeResponse'

  /notices/recipient-preview:
    post:
      tags: [Notices]
      summary: 预览去重后的有效通知接收人
      operationId: previewNoticeRecipients
      x-permission: notice.publish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientSelection'
      responses:
        '200':
          description: 实际接收人数及有效人员摘要，不产生通知和接收记录

  /notices/{noticeId}:
    get:
      tags: [Notices]
      summary: 获取可管理的通知详情
      operationId: getManagedNotice
      x-permission: notice.publish or notice.stats or notice.manage
      parameters:
        - $ref: '#/components/parameters/NoticeId'
      responses:
        '200':
          description: 通知详情
    patch:
      tags: [Notices]
      summary: 修改草稿或创建已发布通知的新版本
      operationId: updateNotice
      x-permission: notice.publish or notice.manage
      parameters:
        - $ref: '#/components/parameters/NoticeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/NoticeDraftRequest'
                - type: object
                  properties:
                    changeReason:
                      type: string
                      maxLength: 255
                    requireReconfirm:
                      type: boolean
      responses:
        '200':
          description: 修改后的通知或新版本
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Notices]
      summary: 取消未发布通知草稿
      operationId: cancelNoticeDraft
      x-permission: notice.publish
      parameters:
        - $ref: '#/components/parameters/NoticeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 草稿状态转为 CANCELLED，不物理删除
        '409':
          $ref: '#/components/responses/Conflict'

  /notices/{noticeId}/publish:
    post:
      tags: [Notices]
      summary: 发布通知并固定接收名单
      operationId: publishNotice
      x-permission: notice.publish
      parameters:
        - $ref: '#/components/parameters/NoticeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 发布结果和实际接收人数
        '409':
          $ref: '#/components/responses/Conflict'

  /notices/{noticeId}/close:
    post:
      tags: [Notices]
      summary: 正常关闭通知
      operationId: closeNotice
      x-permission: notice.manage
      parameters:
        - $ref: '#/components/parameters/NoticeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/OptionalReason'
      responses:
        '200':
          description: 已关闭

  /notices/{noticeId}/withdraw:
    post:
      tags: [Notices]
      summary: 撤回通知并保留历史
      operationId: withdrawNotice
      x-permission: notice.manage
      parameters:
        - $ref: '#/components/parameters/NoticeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/RequiredReason'
      responses:
        '200':
          description: 已撤回

  /notices/{noticeId}/recipients:
    get:
      tags: [Notices]
      summary: 查询通知接收与确认明细
      operationId: listNoticeRecipients
      x-permission: notice.stats
      parameters:
        - $ref: '#/components/parameters/NoticeId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 接收人、查看、确认、版本和派生逾期状态
    post:
      tags: [Notices]
      summary: 向已发布通知追加接收人
      operationId: addNoticeRecipients
      x-permission: notice.manage
      parameters:
        - $ref: '#/components/parameters/NoticeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientSelection'
      responses:
        '200':
          description: 追加结果

  /notices/{noticeId}/recipients/{userId}/exclude:
    post:
      tags: [Notices]
      summary: 排除误选接收人
      operationId: excludeNoticeRecipient
      x-permission: notice.manage
      parameters:
        - $ref: '#/components/parameters/NoticeId'
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/RequiredReason'
      responses:
        '200':
          description: 已排除并保留历史

  /notices/{noticeId}/reminders:
    post:
      tags: [Reminders]
      summary: 对未确认人员发起人工催办
      operationId: remindNoticeRecipients
      x-permission: notice.remind
      parameters:
        - $ref: '#/components/parameters/NoticeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderRequest'
      responses:
        '202':
          description: 催办已记录并进入发送队列
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /tasks:
    get:
      tags: [Tasks]
      summary: 查询可管理的任务
      operationId: listManagedTasks
      x-permission: task.publish or task.stats or task.review or task.manage
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
      responses:
        '200':
          description: 任务分页列表
    post:
      tags: [Tasks]
      summary: 创建任务草稿
      operationId: createTask
      x-permission: task.publish
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskDraftRequest'
      responses:
        '201':
          description: 任务草稿

  /tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: 获取可管理的任务详情
      operationId: getManagedTask
      x-permission: task.publish or task.stats or task.review or task.manage
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: 任务详情
    patch:
      tags: [Tasks]
      summary: 修改任务草稿
      operationId: updateTaskDraft
      x-permission: task.publish
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskDraftRequest'
      responses:
        '200':
          description: 更新后的草稿
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Tasks]
      summary: 取消未发布任务草稿
      operationId: cancelTaskDraft
      x-permission: task.publish
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 草稿状态转为 CANCELLED，不物理删除
        '409':
          $ref: '#/components/responses/Conflict'

  /tasks/{taskId}/publish:
    post:
      tags: [Tasks]
      summary: 发布任务并固定负责人名单
      operationId: publishTask
      x-permission: task.publish
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 发布结果和实际负责人数

  /tasks/{taskId}/close:
    post:
      tags: [Tasks]
      summary: 正常关闭任务
      operationId: closeTask
      x-permission: task.manage
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/OptionalReason'
      responses:
        '200':
          description: 已关闭

  /tasks/{taskId}/withdraw:
    post:
      tags: [Tasks]
      summary: 撤回任务并保留历史
      operationId: withdrawTask
      x-permission: task.manage
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/RequiredReason'
      responses:
        '200':
          description: 已撤回

  /tasks/{taskId}/records:
    get:
      tags: [Tasks]
      summary: 查询任务执行与审核明细
      operationId: listTaskRecords
      x-permission: task.stats or task.review
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 负责人状态、提交版本和审核结果

  /tasks/{taskId}/records/{recordId}/review:
    post:
      tags: [Tasks]
      summary: 审核通过或退回当前提交
      operationId: reviewTaskSubmission
      x-permission: task.review
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [submissionId, action]
              properties:
                submissionId:
                  type: string
                  format: uuid
                action:
                  type: string
                  enum: [APPROVE, RETURN]
                comment:
                  type: string
                  maxLength: 1000
                  description: action 为 RETURN 时必填，由服务端进行条件校验。
      responses:
        '200':
          description: 审核结果
        '409':
          $ref: '#/components/responses/Conflict'

  /tasks/{taskId}/records/{recordId}/exclude:
    post:
      tags: [Tasks]
      summary: 排除任务负责人
      operationId: excludeTaskAssignee
      x-permission: task.manage
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/RecordId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/RequiredReason'
      responses:
        '200':
          description: 已排除并保留历史

  /tasks/{taskId}/reminders:
    post:
      tags: [Reminders]
      summary: 对未完成人员发起人工催办
      operationId: remindTaskAssignees
      x-permission: task.remind
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderRequest'
      responses:
        '202':
          description: 催办已记录并进入发送队列
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /dashboard/management:
    get:
      tags: [Reports]
      summary: 获取管理首页可追溯指标
      operationId: getManagementDashboard
      x-permission: notice.stats or task.stats or task.review
      responses:
        '200':
          description: 待确认、待完成、待审核和逾期汇总

  /exports:
    post:
      tags: [Reports]
      summary: 创建通知或任务明细导出
      operationId: createExport
      x-permission: report.export
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [NOTICE_RECIPIENTS, TASK_RECORDS]
                filters:
                  type: object
                  additionalProperties: true
      responses:
        '202':
          description: 导出任务已创建并记录审计，返回 exportId 和 QUEUED 状态

  /exports/{exportId}:
    get:
      tags: [Reports]
      summary: 查询导出状态并在完成后获取短时下载地址
      operationId: getExport
      x-permission: report.export
      parameters:
        - $ref: '#/components/parameters/ExportId'
      responses:
        '200':
          description: 导出状态、完成时间、有效期和短时下载地址
        '404':
          $ref: '#/components/responses/NotFound'

  /files/upload-intents:
    post:
      tags: [Files]
      summary: 申请附件上传凭据
      operationId: createUploadIntent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, mimeType, sizeBytes, sha256, purpose]
              properties:
                fileName:
                  type: string
                  maxLength: 255
                mimeType:
                  type: string
                  maxLength: 128
                sizeBytes:
                  type: integer
                  minimum: 1
                sha256:
                  type: string
                  pattern: '^[a-fA-F0-9]{64}$'
                purpose:
                  type: string
                  enum: [NOTICE_ATTACHMENT, TASK_ATTACHMENT, TASK_SUBMISSION]
      responses:
        '201':
          description: 文件 ID 和短时上传凭据
        '413':
          description: 文件过大

  /files/{fileId}/complete:
    post:
      tags: [Files]
      summary: 完成附件上传并由服务端核验
      operationId: completeUpload
      parameters:
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 文件已就绪或被拦截
        '409':
          $ref: '#/components/responses/Conflict'

  /audit-logs:
    get:
      tags: [Audit]
      summary: 查询本科室审计日志
      operationId: listAuditLogs
      x-permission: audit.view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: action
          in: query
          schema:
            type: string
            maxLength: 96
        - name: actorId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 只读审计日志分页列表

  /health/live:
    get:
      tags: [Health]
      summary: 存活检查
      operationId: healthLive
      security: []
      responses:
        '200':
          description: 进程存活

  /health/ready:
    get:
      tags: [Health]
      summary: 就绪检查
      operationId: healthReady
      security: []
      responses:
        '200':
          description: 核心依赖就绪
        '503':
          $ref: '#/components/responses/DependencyError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 同一用户、方法和路径范围内的请求幂等键。
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NoticeId:
      name: noticeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  requestBodies:
    RequiredReason:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [reason]
            properties:
              reason:
                type: string
                minLength: 1
                maxLength: 255
    OptionalReason:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
                maxLength: 255

  responses:
    AuthSuccess:
      description: 认证成功
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'
    BadRequest:
      description: 请求校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未登录或凭据无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Locked:
      description: 账号临时锁定
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在或无权查看
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 幂等、版本或状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Gone:
      description: 激活码已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 超过频率或次数限制
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyError:
      description: 外部依赖暂不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    UserRole:
      type: string
      enum: [HEAD_NURSE, COORDINATOR, NURSE]
    UserStatus:
      type: string
      enum: [PENDING_ACTIVATION, ACTIVE, LOCKED, DISABLED]
    ClientPlatform:
      type: string
      enum: [MINI_PROGRAM, H5, ADMIN_WEB]
    NoticeLevel:
      type: string
      enum: [NORMAL, IMPORTANT, URGENT]
    NoticeStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CLOSED, WITHDRAWN, CANCELLED]
    TaskStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CLOSED, WITHDRAWN, CANCELLED]
    TaskCompletionMode:
      type: string
      enum: [SIMPLE, REVIEW]
    TaskRecordStatus:
      type: string
      enum: [PENDING, SUBMITTED, RETURNED, APPROVED, COMPLETED, EXCLUDED]
    PermissionCode:
      type: string
      enum:
        - notice.publish
        - notice.stats
        - notice.remind
        - notice.manage
        - task.publish
        - task.stats
        - task.remind
        - task.review
        - task.manage
        - user.manage
        - permission.manage
        - report.export
        - audit.view

    ActivateRequest:
      type: object
      required: [employeeNo, activationCode, password, clientPlatform, deviceName]
      properties:
        employeeNo:
          type: string
          minLength: 1
          maxLength: 64
        activationCode:
          type: string
          minLength: 6
          maxLength: 32
        password:
          type: string
          minLength: 10
          maxLength: 72
        clientPlatform:
          $ref: '#/components/schemas/ClientPlatform'
        deviceName:
          type: string
          maxLength: 128

    LoginRequest:
      type: object
      required: [employeeNo, password, clientPlatform, deviceName]
      properties:
        employeeNo:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 72
        clientPlatform:
          $ref: '#/components/schemas/ClientPlatform'
        deviceName:
          type: string
          maxLength: 128

    ResetPasswordRequest:
      type: object
      required: [employeeNo, resetCode, newPassword]
      properties:
        employeeNo:
          type: string
          minLength: 1
          maxLength: 64
        resetCode:
          type: string
          minLength: 6
          maxLength: 32
        newPassword:
          type: string
          minLength: 10
          maxLength: 72

    AuthResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [accessToken, refreshToken, expiresIn, user]
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            expiresIn:
              type: integer
              minimum: 1
            user:
              $ref: '#/components/schemas/User'
        requestId:
          type: string

    WechatAssociationResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [associated, associatedAt]
          properties:
            associated:
              type: boolean
              const: true
            associatedAt:
              type: string
              format: date-time
        requestId:
          type: string

    User:
      type: object
      required: [id, employeeNo, name, role, status]
      properties:
        id:
          type: string
          format: uuid
        employeeNo:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        primaryGroupId:
          type: [string, 'null']
          format: uuid

    MeResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [user, permissions, wechatAssociated]
          properties:
            user:
              $ref: '#/components/schemas/User'
            permissions:
              type: array
              items:
                $ref: '#/components/schemas/PermissionCode'
            wechatAssociated:
              type: boolean
        requestId:
          type: string

    CreateUserRequest:
      type: object
      required: [employeeNo, name, role]
      properties:
        employeeNo:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 64
        role:
          $ref: '#/components/schemas/UserRole'
        primaryGroupId:
          type: [string, 'null']
          format: uuid

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 64
        role:
          $ref: '#/components/schemas/UserRole'
        primaryGroupId:
          type: [string, 'null']
          format: uuid
        status:
          $ref: '#/components/schemas/UserStatus'
        reason:
          type: string
          maxLength: 255

    GroupRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 64
        enabled:
          type: boolean
          default: true

    UserResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          $ref: '#/components/schemas/User'
        requestId:
          type: string

    ActivationCodeResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [activationCode, expiresAt]
          properties:
            activationCode:
              type: string
              description: 仅本次响应返回明文，服务端只保存摘要。
            expiresAt:
              type: string
              format: date-time
        requestId:
          type: string

    RecipientSelection:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [ALL_ACTIVE, GROUPS, USERS]
        groupIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
        userIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid

    NoticeDraftRequest:
      type: object
      required: [title, content, level, requiresConfirmation, recipientSelection]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 20000
        level:
          $ref: '#/components/schemas/NoticeLevel'
        requiresConfirmation:
          type: boolean
        deadlineAt:
          type: [string, 'null']
          format: date-time
        recipientSelection:
          $ref: '#/components/schemas/RecipientSelection'
        attachmentFileIds:
          type: array
          uniqueItems: true
          maxItems: 9
          items:
            type: string
            format: uuid

    NoticeSummary:
      type: object
      required: [id, title, level, status, currentVersionNo, recipientStatus]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        level:
          $ref: '#/components/schemas/NoticeLevel'
        status:
          $ref: '#/components/schemas/NoticeStatus'
        currentVersionNo:
          type: integer
        deadlineAt:
          type: [string, 'null']
          format: date-time
        recipientStatus:
          type: string

    ManagedNoticeResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          $ref: '#/components/schemas/NoticeSummary'
        requestId:
          type: string

    NoticeDetailResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/NoticeSummary'
            - type: object
              required: [content, viewedAt]
              properties:
                content:
                  type: string
                viewedAt:
                  type: string
                  format: date-time
                confirmedAt:
                  type: [string, 'null']
                  format: date-time
                confirmedVersionNo:
                  type: [integer, 'null']
                attachments:
                  type: array
                  items:
                    $ref: '#/components/schemas/FileReference'
        requestId:
          type: string

    ConfirmationResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [noticeId, versionNo, confirmedAt]
          properties:
            noticeId:
              type: string
              format: uuid
            versionNo:
              type: integer
            confirmedAt:
              type: string
              format: date-time
        requestId:
          type: string

    TaskDraftRequest:
      type: object
      required: [title, content, level, completionMode, deadlineAt, assigneeSelection]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 20000
        level:
          $ref: '#/components/schemas/NoticeLevel'
        completionMode:
          $ref: '#/components/schemas/TaskCompletionMode'
        deadlineAt:
          type: string
          format: date-time
        feedbackRequired:
          type: boolean
          default: false
        attachmentRequired:
          type: boolean
          default: false
        assigneeSelection:
          $ref: '#/components/schemas/RecipientSelection'
        attachmentFileIds:
          type: array
          uniqueItems: true
          maxItems: 9
          items:
            type: string
            format: uuid

    TaskSummary:
      type: object
      required: [id, title, status, completionMode, recordStatus, deadlineAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        completionMode:
          $ref: '#/components/schemas/TaskCompletionMode'
        recordStatus:
          $ref: '#/components/schemas/TaskRecordStatus'
        deadlineAt:
          type: string
          format: date-time

    TaskDetailResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/TaskSummary'
            - type: object
              required: [content, submissions]
              properties:
                content:
                  type: string
                attachments:
                  type: array
                  items:
                    $ref: '#/components/schemas/FileReference'
                submissions:
                  type: array
                  items:
                    $ref: '#/components/schemas/TaskSubmission'
        requestId:
          type: string

    TaskSubmissionRequest:
      type: object
      properties:
        feedback:
          type: string
          maxLength: 5000
        attachmentFileIds:
          type: array
          uniqueItems: true
          maxItems: 9
          items:
            type: string
            format: uuid

    TaskSubmission:
      type: object
      required: [id, submissionNo, reviewStatus, submittedAt]
      properties:
        id:
          type: string
          format: uuid
        submissionNo:
          type: integer
          minimum: 1
        feedback:
          type: [string, 'null']
        reviewStatus:
          type: string
          enum: [PENDING, APPROVED, RETURNED]
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: [string, 'null']
          format: date-time
        reviewComment:
          type: [string, 'null']

    TaskSubmissionResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          $ref: '#/components/schemas/TaskSubmission'
        requestId:
          type: string

    TaskRecordResponse:
      type: object
      required: [data, requestId]
      properties:
        data:
          type: object
          required: [taskId, status, completedAt]
          properties:
            taskId:
              type: string
              format: uuid
            status:
              type: string
              const: COMPLETED
            completedAt:
              type: string
              format: date-time
        requestId:
          type: string

    ReminderRequest:
      type: object
      required: [channels]
      properties:
        targetUserIds:
          type: array
          uniqueItems: true
          description: 省略时选择当前所有符合催办条件的人员。
          items:
            type: string
            format: uuid
        channels:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [IN_APP, WECHAT_SUBSCRIBE, MANUAL]
        note:
          type: string
          maxLength: 255

    FileReference:
      type: object
      required: [id, fileName, mimeType, sizeBytes]
      properties:
        id:
          type: string
          format: uuid
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer

    PageInfo:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    PagedResponse:
      type: object
      required: [data, page, requestId]
      properties:
        data:
          type: array
          items: {}
        page:
          $ref: '#/components/schemas/PageInfo'
        requestId:
          type: string

    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        requestId:
